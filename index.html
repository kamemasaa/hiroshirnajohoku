<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【重大な警告】システムが奪われてています</title>
    <style>
        /* 全体のリセットと背景 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 背景のフェイクブラウザ感 */
        .desktop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            filter: blur(8px);
            z-index: 1;
        }

        /* ポップアップのスタイル */
        .popup-window {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #ff4a4a;
            animation: shake 0.5s ease-in-out infinite alternate;
        }

        /* 警告を煽る少しの揺れアニメーション */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(0.1deg); }
        }

        /* ヘッダー部分 */
        .popup-header {
            background-color: #ff4a4a;
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 14px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 18px;
        }

        /* コンテンツ部分 */
        .popup-body {
            padding: 25px;
            color: #333333;
            text-align: center;
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .popup-title {
            color: #d93025;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .popup-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #ff4a4a;
        }

        /* 偽のボタンエリア */
        .btn-container {
            display: flex;
            justify-content: space-around;
        }

        .action-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #1557b0;
        }

        .action-btn.secondary {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .action-btn.secondary:hover {
            background-color: #d2e3fc;
        }
    </style>
</head>
<body>

    <div class="desktop-bg"></div>

    <div class="popup-window">
        <div class="popup-header">
            <span>⚠️ セキュリティ警告 </span>
            <span class="close-btn" onclick="alert('閉じないでください。0792830-8275828-2758930に電話')">✕</span>
        </div>
        <div class="popup-body">
            <div class="warning-icon">トロイの木馬</div>
            <div class="popup-title">トロイの木馬他99件が検出されました</div>
            
            <div class="popup-text">
                お使いの端末が<strong>トロイの木馬</strong>によって占拠された可能性があります。<br>
                このままではIPアドレスが全送信される恐れがあります。
            </div>

            <div class="btn-container">
                <a href="#" class="action-btn" onclick="alert('サポートを受けられませんでした。')">公式のサポートを受ける</a>
                <a href="#" class="action-btn secondary" onclick="alert(情報が送信されました)">キャンセル</a>
            </div>
        </div>
    </div>

</body>
</html>
